# mediator (Điều khiển, khối 3 trên slide): nhận POST /add, gửi từng URL sang downloader.
port: 5200
downloaders:                       # downloader (Tải về, nhóm N5); cổng theo slide là 8800. Sửa IP cho đúng.
  - http://10.177.29.215:8800
host_delay_seconds: 1.0            # "thời gian chờ" giữa hai lần gửi vào cùng một host
ping_timeout_seconds: 2
load_timeout_seconds: 10
node_cooldown_seconds: 30          # downloader không trả lời thì chừng này giây sau mới hỏi lại
max_attempts: 5
tick_seconds: 0.5
recrawl_days: {hub: 1, page: 7, document: 30}   # kiểm tra lại định kỳ; 0 = không kiểm tra lại
database: /state/controller.sqlite3
