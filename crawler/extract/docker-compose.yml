# docker compose up -d --build
# curl -X POST localhost:8080/extract -H 'Content-Type: application/json' -d '{"url": "https://hust.edu.vn/..."}'
name: hust-extract

services:
  extract:
    build: .
    ports: ["8080:8080"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: hust_extract
      TIKA_URL: http://tika:9998
    depends_on:
      mongo: {condition: service_healthy}
      tika: {condition: service_started}

  tika:
    image: apache/tika:4.1.0

  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27018:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
