# docker compose up -d --build
# curl -X POST localhost:6600/parse -H 'Content-Type: application/json' -d '{"url":"https://hust.edu.vn/a","format":"html","encoding":"text","content":"<h1>Tiêu đề</h1>"}'
name: reader-service

services:
  reader-service:
    build: .
    ports: ["6600:6600"]
    environment:
      # Địa chỉ /add của service lưu trữ (vd http://<ip>:2222/add). Rỗng thì không gửi, /parse trả "record".
      STORAGE_URL: ""
      # Địa chỉ /add của service điều khiển (vd http://<ip>:5200/add), nhận các liên kết thuộc hust.edu.vn. Rỗng thì không gọi.
      MEDIATOR_URL: ""
      # Bật POST /fetch cho demo.html . Đặt "0" khi không cần tải html/file về (nhận kết quả từ service khác).
      DEMO_FETCH: "1"
